name: Weekly Skills Sync

on:
  schedule:
    # Every Monday at 08:00 UTC = 09:00 CET (UTC+1)
    - cron: "0 8 * * 1"
  workflow_dispatch: # allow manual triggering for testing

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Capture submodule SHAs before update
        id: before
        run: |
          echo "antfu=$(git -C vendor/antfu-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sanity=$(git -C vendor/sanity-agent-toolkit rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "julius=$(git -C vendor/julius-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "emil=$(git -C vendor/emil-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update submodules to latest upstream
        run: git submodule update --remote --init --recursive

      - name: Capture submodule SHAs after update
        id: after
        run: |
          echo "antfu=$(git -C vendor/antfu-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sanity=$(git -C vendor/sanity-agent-toolkit rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "julius=$(git -C vendor/julius-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "emil=$(git -C vendor/emil-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Re-copy vendored skills (antfu/skills)
        run: |
          rm -rf skills/nuxt skills/vue skills/vite
          cp -R vendor/antfu-skills/skills/nuxt skills/nuxt
          cp -R vendor/antfu-skills/skills/vue skills/vue
          cp -R vendor/antfu-skills/skills/vite skills/vite

      - name: Re-copy vendored skills (JuliusBrussee/skills)
        run: |
          rm -rf skills/caveman skills/deslopify skills/grill-me skills/junior-to-senior
          cp -R vendor/julius-skills/skills/caveman skills/caveman
          cp -R vendor/julius-skills/skills/deslopify skills/deslopify
          cp -R vendor/julius-skills/skills/grill-me skills/grill-me
          cp -R vendor/julius-skills/skills/junior-to-senior skills/junior-to-senior

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Re-compact vendored skills (gsap, sanity, animation)
        run: node scripts/sync-vendored.mjs

      - name: Validate updated skills
        run: |
          # skills live at skills/<name>/ or in a group folder skills/<group>/<name>/
          find skills -mindepth 2 -maxdepth 3 -name SKILL.md | sort | while read -r f; do
            skill_dir=$(dirname "$f")
            echo "Validating $skill_dir"
            npx -y skills-ref validate "$skill_dir" || exit 1
          done

      - name: Smoke test skills discovery
        run: npx -y skills add . --list

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log no-change result
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "All upstream submodules are already up to date. No PR will be created."

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/weekly-skills-sync
          base: main
          commit-message: "chore: weekly sync of vendored skills"
          title: "chore: weekly vendored skills sync"
          body: |
            ## Weekly Vendored Skills Sync

            This PR was created automatically by the weekly sync workflow.

            ### Upstream changes

            | Vendor | Before | After | Changed |
            |--------|--------|-------|---------|
            | `antfu/skills` | `${{ steps.before.outputs.antfu }}` | `${{ steps.after.outputs.antfu }}` | ${{ steps.before.outputs.antfu != steps.after.outputs.antfu && 'yes' || 'no' }} |
            | `sanity-io/agent-toolkit` | `${{ steps.before.outputs.sanity }}` | `${{ steps.after.outputs.sanity }}` | ${{ steps.before.outputs.sanity != steps.after.outputs.sanity && 'yes' || 'no' }} |
            | `JuliusBrussee/skills` | `${{ steps.before.outputs.julius }}` | `${{ steps.after.outputs.julius }}` | ${{ steps.before.outputs.julius != steps.after.outputs.julius && 'yes' || 'no' }} |
            | `emilkowalski/skills` | `${{ steps.before.outputs.emil }}` | `${{ steps.after.outputs.emil }}` | ${{ steps.before.outputs.emil != steps.after.outputs.emil && 'yes' || 'no' }} |

            ### Vendored skill directories updated

            - `skills/nuxt`, `skills/vue`, `skills/vite` (from `antfu/skills`)
            - `skills/caveman`, `skills/deslopify`, `skills/grill-me`, `skills/junior-to-senior` (from `JuliusBrussee/skills`)
            - `skills/gsap`, `skills/sanity`, `skills/animation` (compacted by `scripts/sync-vendored.mjs` from `greensock/gsap-skills`, `sanity-io/agent-toolkit`, `emilkowalski/skills`)

            ### Validation

            All skills passed `skills-ref validate` and `skills add . --list` before this PR was opened.

            > First-party skills (`nuxt-sanity`, `nuxt-seo`, `ruby-on-rails`, `tailwind`) are not affected by this sync.

      - name: Run CI for pull request branch
        if: steps.changes.outputs.has_changes == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "automated/weekly-skills-sync"

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --rebase \
            --repo "${{ github.repository }}" \
            "${{ steps.create-pr.outputs.pull-request-number }}"
