name: Weekly Skills Sync

on:
  schedule:
    # Every Monday at 08:00 UTC = 09:00 CET (UTC+1)
    - cron: "0 8 * * 1"
  workflow_dispatch: # allow manual triggering for testing

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Capture submodule SHAs before update
        id: before
        run: |
          echo "antfu=$(git -C vendor/antfu-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sanity=$(git -C vendor/sanity-agent-toolkit rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "gsap=$(git -C vendor/gsap-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "vercel=$(git -C vendor/vercel-agent-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "shopify=$(git -C vendor/shopify-ai-toolkit rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "julius=$(git -C vendor/julius-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "caveman=$(git -C vendor/caveman-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "emil=$(git -C vendor/emil-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ponytail=$(git -C vendor/ponytail-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "mwg=$(git -C vendor/modern-web-guidance rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "anthropic=$(git -C vendor/anthropic-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update submodules to latest upstream
        run: git submodule update --remote --init --recursive

      - name: Capture submodule SHAs after update
        id: after
        run: |
          echo "antfu=$(git -C vendor/antfu-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sanity=$(git -C vendor/sanity-agent-toolkit rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "gsap=$(git -C vendor/gsap-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "vercel=$(git -C vendor/vercel-agent-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "shopify=$(git -C vendor/shopify-ai-toolkit rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "julius=$(git -C vendor/julius-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "caveman=$(git -C vendor/caveman-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "emil=$(git -C vendor/emil-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ponytail=$(git -C vendor/ponytail-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "mwg=$(git -C vendor/modern-web-guidance rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "anthropic=$(git -C vendor/anthropic-skills rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Re-copy vendored skills (antfu/skills)
        run: |
          rm -rf skills/nuxt skills/vue skills/vite
          cp -R vendor/antfu-skills/skills/nuxt skills/nuxt
          cp -R vendor/antfu-skills/skills/vue skills/vue
          cp -R vendor/antfu-skills/skills/vite skills/vite

      - name: Re-copy vendored skills (vercel-labs/agent-skills)
        run: |
          rm -rf skills/web-design-guidelines
          cp -R vendor/vercel-agent-skills/skills/web-design-guidelines skills/web-design-guidelines

      - name: Re-copy vendored skills (JuliusBrussee/skills)
        run: |
          rm -rf skills/deslopify skills/grill-me skills/junior-to-senior
          cp -R vendor/julius-skills/skills/deslopify skills/deslopify
          cp -R vendor/julius-skills/skills/grill-me skills/grill-me
          cp -R vendor/julius-skills/skills/junior-to-senior skills/junior-to-senior

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Re-generate vendored skills (gsap, sanity, animation, shopify, caveman, ponytail, modern-web-guidance, frontend-design)
        run: node scripts/sync-vendored.mjs

      - name: Validate updated skills
        run: |
          # skills live at skills/<name>/ or in a group folder skills/<group>/<name>/
          find skills -mindepth 2 -maxdepth 3 -name SKILL.md | sort | while read -r f; do
            skill_dir=$(dirname "$f")
            echo "Validating $skill_dir"
            npx -y skills-ref validate "$skill_dir" || exit 1
          done

      - name: Smoke test skills discovery
        run: npx -y skills add . --list

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log no-change result
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "All upstream submodules are already up to date. No PR will be created."

      # PRs opened with GITHUB_TOKEN get their pull_request CI run stuck in
      # "action_required", which blocks auto-merge. Prefer a GitHub App token
      # (vars.SYNC_APP_ID + secrets.SYNC_APP_PRIVATE_KEY) or a PAT (secrets.SYNC_PAT);
      # GITHUB_TOKEN stays as fallback.
      - name: Create GitHub App token
        id: app-token
        if: steps.changes.outputs.has_changes == 'true' && vars.SYNC_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Pick token
        id: token
        if: steps.changes.outputs.has_changes == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -n "$APP_TOKEN" ] || [ -n "$PAT" ]; then
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SYNC_APP_ID/SYNC_PAT configured, using GITHUB_TOKEN: the PR CI run will need a manual approval before auto-merge."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          branch: automated/weekly-skills-sync
          base: main
          commit-message: "chore: weekly sync of vendored skills"
          title: "chore: weekly vendored skills sync"
          body: |
            ## Weekly Vendored Skills Sync

            This PR was created automatically by the weekly sync workflow.

            ### Upstream changes

            | Vendor | Before | After | Changed |
            |--------|--------|-------|---------|
            | `antfu/skills` | `${{ steps.before.outputs.antfu }}` | `${{ steps.after.outputs.antfu }}` | ${{ steps.before.outputs.antfu != steps.after.outputs.antfu && 'yes' || 'no' }} |
            | `sanity-io/agent-toolkit` | `${{ steps.before.outputs.sanity }}` | `${{ steps.after.outputs.sanity }}` | ${{ steps.before.outputs.sanity != steps.after.outputs.sanity && 'yes' || 'no' }} |
            | `greensock/gsap-skills` | `${{ steps.before.outputs.gsap }}` | `${{ steps.after.outputs.gsap }}` | ${{ steps.before.outputs.gsap != steps.after.outputs.gsap && 'yes' || 'no' }} |
            | `vercel-labs/agent-skills` | `${{ steps.before.outputs.vercel }}` | `${{ steps.after.outputs.vercel }}` | ${{ steps.before.outputs.vercel != steps.after.outputs.vercel && 'yes' || 'no' }} |
            | `Shopify/Shopify-AI-Toolkit` | `${{ steps.before.outputs.shopify }}` | `${{ steps.after.outputs.shopify }}` | ${{ steps.before.outputs.shopify != steps.after.outputs.shopify && 'yes' || 'no' }} |
            | `JuliusBrussee/skills` | `${{ steps.before.outputs.julius }}` | `${{ steps.after.outputs.julius }}` | ${{ steps.before.outputs.julius != steps.after.outputs.julius && 'yes' || 'no' }} |
            | `JuliusBrussee/caveman` | `${{ steps.before.outputs.caveman }}` | `${{ steps.after.outputs.caveman }}` | ${{ steps.before.outputs.caveman != steps.after.outputs.caveman && 'yes' || 'no' }} |
            | `emilkowalski/skills` | `${{ steps.before.outputs.emil }}` | `${{ steps.after.outputs.emil }}` | ${{ steps.before.outputs.emil != steps.after.outputs.emil && 'yes' || 'no' }} |
            | `dietrichgebert/ponytail` | `${{ steps.before.outputs.ponytail }}` | `${{ steps.after.outputs.ponytail }}` | ${{ steps.before.outputs.ponytail != steps.after.outputs.ponytail && 'yes' || 'no' }} |
            | `GoogleChrome/modern-web-guidance` | `${{ steps.before.outputs.mwg }}` | `${{ steps.after.outputs.mwg }}` | ${{ steps.before.outputs.mwg != steps.after.outputs.mwg && 'yes' || 'no' }} |
            | `anthropics/skills` | `${{ steps.before.outputs.anthropic }}` | `${{ steps.after.outputs.anthropic }}` | ${{ steps.before.outputs.anthropic != steps.after.outputs.anthropic && 'yes' || 'no' }} |

            ### Vendored skill directories updated

            - `skills/nuxt`, `skills/vue`, `skills/vite` (from `antfu/skills`)
            - `skills/web-design-guidelines` (from `vercel-labs/agent-skills`)
            - `skills/deslopify`, `skills/grill-me`, `skills/junior-to-senior` (from `JuliusBrussee/skills`)
            - `skills/gsap`, `skills/sanity`, `skills/animation` (compacted by `scripts/sync-vendored.mjs` from `greensock/gsap-skills`, `sanity-io/agent-toolkit`, `emilkowalski/skills`)
            - `skills/shopify`, `skills/ucp`, `skills/caveman`, `skills/ultracave`, `skills/megacave`, `skills/ponytail`, `skills/modern-web-guidance`, `skills/frontend-design` (copied by `scripts/sync-vendored.mjs` from `Shopify/Shopify-AI-Toolkit`, `JuliusBrussee/caveman`, `dietrichgebert/ponytail`, `GoogleChrome/modern-web-guidance`, `anthropics/skills`)

            ### Validation

            All skills passed `skills-ref validate` and `skills add . --list` before this PR was opened.

            > First-party skills (e.g. `nuxt-sanity`, `shopify-development`) are not affected by this sync.

      # Only needed with GITHUB_TOKEN: its PR events do not start CI normally.
      - name: Run CI for pull request branch
        if: steps.changes.outputs.has_changes == 'true' && steps.create-pr.outputs.pull-request-number && steps.token.outputs.fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "automated/weekly-skills-sync"

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --rebase \
            --repo "${{ github.repository }}" \
            "${{ steps.create-pr.outputs.pull-request-number }}"
